<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f5bd3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="토익 복습">
  <title>토익 900 복습</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>토익 900 복습</h1>
    <span id="weekBadge" class="badge"></span>
  </header>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home">🏠<span>오늘</span></button>
    <button data-tab="words">📖<span>단어</span></button>
    <button data-tab="mistakes">✏️<span>오답</span></button>
    <button data-tab="tests">📝<span>회차</span></button>
    <button data-tab="more">⋯<span>더보기</span></button>
  </nav>
  <div id="toast" class="toast" hidden></div>
  <noscript><p style="padding:16px">JavaScript를 켜야 앱이 실행돼요.</p></noscript>
  <script>
    // 앱이 폰에서 멈췄을 때 빈 화면 대신 원인을 보여줌
    (function () {
      function show(msg) {
        var m = document.getElementById('main');
        if (!m) return;
        m.innerHTML = '<section class="card"><h2>앱 실행 중 오류가 났어요</h2>' +
          '<p class="small" style="word-break:break-all"></p>' +
          '<button class="btn primary" onclick="location.reload()">새로고침</button></section>';
        m.querySelector('p').textContent = msg;
      }
      window.addEventListener('error', function (e) {
        show((e.message || '스크립트를 불러오지 못했어요') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) { show(String(e.reason)); });
    })();
  </script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
